<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico de instalação</title>
<style>body{margin:0;background:#000;color:#f2f2f2;font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}
h1{font-size:20px;font-weight:500}.r{padding:10px 0;border-bottom:1px solid #222}.ok{color:#5ec27a}.no{color:#e74c3c}.m{color:#888;font-size:13px}
button{background:#f2f2f2;color:#000;border:0;border-radius:8px;padding:12px 18px;font:inherit;margin-top:12px;display:none;width:100%}</style></head>
<body><h1>Diagnóstico de instalação</h1><div id="o"></div><button id="b">Instalar agora</button>
<script>
const o=document.getElementById("o"),b=document.getElementById("b");let dp=null;
const add=(ok,t,m)=>{const d=document.createElement("div");d.className="r";d.innerHTML=`<b class="${ok?"ok":"no"}">${ok?"✓":"✗"}</b> ${t}${m?`<div class="m">${m}</div>`:""}`;o.appendChild(d);return d};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;b.style.display="block"});
b.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;b.style.display="none"};
(async()=>{
 const ua=navigator.userAgent,inapp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|Telegram/i.test(ua),other=/SamsungBrowser|OPR\/|EdgA|FxiOS|Firefox|DuckDuckGo|Brave/i.test(ua),chrome=/Chrome\//.test(ua)&&!other&&!inapp;
 add(location.protocol==="https:"||location.hostname==="localhost","Endereço seguro (https)",location.origin);
 add(chrome,"Navegador Chrome",inapp?"Você abriu dentro de outro app (WhatsApp, Instagram etc.). Abra o link direto no Chrome.":other?"Este não parece ser o Chrome. Teste no Chrome.":ua.slice(0,90));
 add(!matchMedia("(display-mode: standalone)").matches,"Ainda não está aberto como app instalado",matchMedia("(display-mode: standalone)").matches?"Você já está dentro do app instalado.":"");
 try{const r=await fetch("manifest.webmanifest",{cache:"no-store"}),j=await r.json();add(r.ok&&!!j.name,"Manifesto encontrado","nome: "+j.name+" · tipo: "+(r.headers.get("content-type")||"?"));
  for(const i of j.icons||[]){try{const x=await fetch(i.src,{cache:"no-store"});add(x.ok&&/image/.test(x.headers.get("content-type")||""),"Ícone "+i.sizes+" ("+i.purpose+")",i.src+" · "+x.status)}catch(e){add(false,"Ícone "+i.sizes,i.src+" não abriu")}}}
 catch(e){add(false,"Manifesto não encontrado","Reenvie a pasta completa para o Netlify, com o arquivo manifest.webmanifest.")}
 try{await fetch("sw.js",{cache:"no-store"}).then(r=>{add(r.ok,"Arquivo sw.js encontrado",r.status+"")})}catch(e){add(false,"Arquivo sw.js não encontrado")}
 if("serviceWorker" in navigator){try{const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;add(true,"Service worker ativo",reg.scope)}catch(e){add(false,"Service worker falhou",String(e).slice(0,140))}}else add(false,"Este navegador não aceita service worker");
 setTimeout(()=>{add(!!dp,dp?"O Chrome liberou a instalação. Use o botão abaixo.":"O Chrome ainda não liberou a instalação","Se todos os itens acima estão ✓ e aqui está ✗: o app já pode estar instalado (procure “Foco” na lista de apps), ou o aparelho não tem os serviços do Google Play. Nesse caso use Adicionar à tela inicial.")},4500);
})();
</script></body></html>
