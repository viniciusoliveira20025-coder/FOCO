<style>

textarea{width:100%;min-height:90px}input[type=text]{width:100%}
button.b{background:var(--sea);color:#fff;border:0;border-radius:4px;padding:10px 16px;font:500 .95rem 'Public Sans',sans-serif;cursor:pointer}
a.b{display:inline-block;text-decoration:none;border-radius:4px;padding:10px 16px;font:500 .95rem 'Public Sans',sans-serif}button.b.g,a.b.g{background:none;color:var(--sea);border:1px solid var(--sea)}button.sm{padding:5px 10px!important;font-size:.82rem!important}

:root{--bg:#000!important;--card:#0b0b0b!important;--ink:#f2f2f2!important;--mut:#777!important;--line:#222!important;--navy:#000!important;--sea:#e74c3c!important;--flag:#c0392b!important}
body{background:#000!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
h1,h2,h3,.tm,.stat b{font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
header{background:none!important;border-bottom:1px solid #222!important;padding:0!important}header h1{display:none!important}
main{padding:16px 0 40px!important}
nav button{color:#777!important;border-bottom-width:1px!important}nav button.on{color:#fff!important;border-color:#fff!important}
.card{border-radius:12px!important}.cur{border-left-width:3px!important}
.pill{background:#1a1a1a!important;color:#ccc!important}
.fcard{perspective:900px;height:210px;cursor:pointer;margin:10px 0}.fcin{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.fcard.fl .fcin{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;border:1px solid #222;border-radius:12px;background:#0b0b0b}.fb{transform:rotateY(180deg);border-color:#c0392b}
.fw{font-size:2rem;font-weight:600}.fh{color:#555;font-size:.8rem;margin-top:12px}.fs{font-size:1.15rem;font-weight:700;margin-bottom:14px}.fe{font-style:italic;color:#bbb}
.fdet{margin:0 0 6px;color:#999;font-size:.9rem}.fdet summary{cursor:pointer;color:#777}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chip{background:none;border:1px solid #222;color:#999;border-radius:16px;padding:6px 12px;font-size:.85rem;cursor:pointer}.chip.on{background:#f2f2f2;color:#000;border-color:#f2f2f2}.chip small{opacity:.7}
.gr{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #222}.gx{display:flex;gap:6px;align-items:center}.gs{text-decoration:none;font-size:1.1rem;padding:4px 6px}
nav button{font-size:.8rem!important;padding:11px 2px!important}

<script>
const SK={grammar:'Grammar',listening:'Listening',reading:'Reading',speaking:'Speaking',writing:'Writing',vocab:'Vocabulary',review:'Revisão'};
const DAYS=[[['review',60]],[['grammar',40],['speaking',50]],[['listening',60],['writing',30]],[['grammar',40],['speaking',50]],[['listening',60],['reading',30]],[['speaking',60],['vocab',30]],[['writing',60],['reading',30]]];
const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const WI='https://writeandimprove.com/workbooks#/wi-workbooks/e203fdd9-cb2e-459d-a36e-0b6a026cbfe6',MI='https://www.marineinsight.com/freeebooksnew/',SH='https://www.shadowing.tech/',LE='https://www.listeninenglish.com/',CA='https://www.cambridgeenglish.org/learning-english/activities-for-learners/?rows=12',YT='https://www.youtube.com/',TC='https://test-english.com/grammar-points/contents/',LT='https://www.cambridgeenglish.org/br/test-your-english/';
const LV=[['a2','A2'],['b1','B1'],['b1-b2','B1+'],['b2','B2']];
const TE=(s,l)=>`https://test-english.com/${s}/${l}/`;
const TXT={
grammar1:'Test-English Grammar ({L}): escolha a próxima lição da lista, na ordem. Leia a explicação e faça os exercícios. Anote abaixo qual lição você fez.',
grammar3:'Refaça os exercícios que você errou e faça mais um exercício do mesmo tema na Test-English. Releia só os pontos que errou.',
listening2:'Listen in English (30 min): 1 lição; ouça sem texto, depois com a transcrição e de novo sem texto. Test-English Listening {L} (30 min): 1 áudio, responda e confira.',
listening4:'YouTube (60 min): 1 vídeo de 15–20 min com legenda em inglês. Repita um trecho de 3 min. Escolha dia a dia, notícias ou vida a bordo.',
speaking1:'Shadowing (25 min): 1 trecho de 1–2 min. Depois grave 3 respostas de 1 min no celular, ouça e anote 3 erros (25 min).',
speaking3:'Shadowing (25 min) e grave de novo respostas sobre o tema da semana (25 min). Compare com a gravação de segunda: o que melhorou?',
speaking5:'Shadowing (20 min) e grave 3 respostas de 1 min; ouça e anote 3 erros (40 min). A cada 4 semanas, troque por uma conversa de 20–30 min com professor ou parceiro e peça feedback.',
writing2:'Escreva um texto curto (A2: 60–80 palavras; B1: 120–150). Corrija com o botão abaixo ou no Write & Improve e reescreva os erros principais.',
writing6:'Write & Improve (60 min): faça uma tarefa do seu workbook, envie, leia o feedback e reescreva. Registre o nível abaixo.',
reading4:'Marine Insight: 1 artigo curto sobre vida a bordo. Leia sem traduzir; depois pesquise 5 palavras.',
reading6:'Test-English Reading {L}: 1 texto com exercícios. Confira e anote o motivo de cada erro.',
vocab5:'Test-English Vocabulary {L} ou Cambridge Activities: 1 lista ou exercício. Escreva 1 frase sua com cada palavra nova e revise as da semana anterior.',
review0:'Revise seus erros da semana, refaça 1 exercício errado de gramática e releia suas gravações e frases. Faça um teste de nível a cada 3 meses. Preencha a nota da semana.'};
function LKS(k,pi){const L=LV[pi],g=[['Test-English Grammar '+L[1],TE('grammar-points',L[0])],['Tabela de conteúdos',TC]];
return({grammar1:g,grammar3:g,listening2:[['Listen in English',LE],['Test-English Listening '+L[1],TE('listening',L[0])]],listening4:[['YouTube',YT]],speaking1:[['Shadowing',SH]],speaking3:[['Shadowing',SH]],speaking5:[['Shadowing',SH]],writing2:[['Write & Improve',WI]],writing6:[['Write & Improve',WI]],reading4:[['Marine Insight',MI]],reading6:[['Test-English Reading '+L[1],TE('reading',L[0])]],vocab5:[['Test-English Vocabulary '+L[1],TE('vocabulary',L[0])],['Cambridge Activities',CA]],review0:[['Teste de nível',LT]]})[k]||[]}
const PH=[{n:'Base',m:'Meses 1–3',goal:'A2 sólido',goals:['Test-English Grammar A2: concluir ao menos 25 lições','Falar 1–2 min sobre o seu dia sem parar','Write & Improve: texto de 80 palavras no nível A2','Test-English Listening A2: acertar 60% ou mais','Fazer um teste de nível no fim do mês 3']},
{n:'Rumo ao B1',m:'Meses 4–6',goal:'B1',goals:['Test-English Grammar B1: concluir ao menos 25 lições','Write & Improve: textos de 120–150 palavras no nível B1','Test-English Listening e Reading B1: acertar 60% ou mais','Falar 3 min sobre um tema, com opinião','Teste de nível no mês 6: B1 ou mais']},
{n:'B1 consolidado',m:'Mês 7 em diante',goal:'B1+ e depois B2',goals:['Test-English B1+: grammar, listening e reading com 70% ou mais','Write & Improve: nível B1+ ou B2','Conversa com feedback a cada 2–4 semanas','Decidir: seguir para o B2 First ou consolidar o B1']}];
const CP=[{m:3,t:'Meta: A2 sólido'},{m:6,t:'Meta: B1'},{m:9,t:'Meta: B1+'},{m:12,t:'Meta: B2 ou B1 firme'}];
const AREAS=['Grammar','Listening','Reading','Speaking','Writing','Vocabulary'];
let S;try{S=JSON.parse(localStorage.getItem('diario-ingles'))}catch(e){}
S=Object.assign({done:{},mn:{},sec:{},nt:{},wk:{},cp:{},wl:[],goals:{},run:null},S||{});
function save(){try{localStorage.setItem('diario-ingles',JSON.stringify(S))}catch(e){}}
const z=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()),pd=s=>new Date(s+'T12:00:00'),today=iso(new Date());
if(!S.start){S.start=today;save()}
let notice='';if(S.run&&Date.now()-S.run.t>3*36e5){S.run=null;notice='Um cronômetro ficou aberto por mais de 3 horas e foi descartado, para não inflar o seu tempo.';save()}
const H=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayN=d=>Math.floor((pd(d)-pd(S.start))/864e5)+1,monthOf=d=>Math.max(1,Math.floor((dayN(d)-1)/30.4)+1),phOf=m=>m<=3?0:m<=6?1:2,wkOf=d=>Math.max(1,Math.floor((dayN(d)-1)/7)+1);
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600);return(h?h+':':'')+z(Math.floor(s%3600/60))+':'+z(s%60)};
const secs=(k,i)=>{let s=S.sec[k]&&S.sec[k][i];if(S.run&&S.run.k===k&&S.run.i==i)s=(s||0)+Math.min(14400,(Date.now()-S.run.t)/1000);return s};
const mins=(k,i,p)=>{const s=secs(k,i);if(s!=null)return s/60;const m=S.mn[k]&&S.mn[k][i];if(m!=null)return m;return S.done[k]&&S.done[k][i]?p:0};
function dayStat(k){const t=DAYS[pd(k).getDay()];let plan=0,min=0;t.forEach((x,i)=>{plan+=x[1];min+=mins(k,i,x[1])});return{plan,min,ok:min*2>=plan}}
function totals(){let min=0,days=0,by={},wk={},ks=new Set([...Object.keys(S.sec),...Object.keys(S.done),...Object.keys(S.mn)]);
ks.forEach(k=>{const t=DAYS[pd(k).getDay()];let any=0;t.forEach((x,i)=>{const m=mins(k,i,x[1]);if(m>0){any=1;min+=m;by[x[0]]=(by[x[0]]||0)+m;const w=wkOf(k);wk[w]=(wk[w]||0)+m}});days+=any});
let st=0,d=new Date();if(!dayStat(iso(d)).ok)d.setDate(d.getDate()-1);while(dayStat(iso(d)).ok&&ks.has(iso(d))){st++;d.setDate(d.getDate()-1)}return{min,days,by,wk,st}}
function stopRun(){const r=S.run;if(!r)return;S.sec[r.k]=S.sec[r.k]||{};S.sec[r.k][r.i]=(S.sec[r.k][r.i]||0)+Math.min(14400,Math.round((Date.now()-r.t)/1000));S.run=null;save()}
let view='hoje',sel=today,zk=null,SAMPLE=null,pr={busy:null,err:'',wt:'',wres:null,wtype:'e-mail'};
if(window.claude&&claude.use)claude.use('sample').then(x=>{SAMPLE=x;if(view==='hoje')render()}).catch(()=>{});
const tabs={hoje:'Hoje',progresso:'Progresso',material:'Material',flash:'Flashcards',gram:'Gramática'};
const VOC=[];
const INT=[1,2,4,8,16];let fcFlip={},fcRev=null,fcEd=null;
const CC=['Expressão natural','Estrutura de frase','Phrasal verb','Vocabulário'];
const mkey=c=>'m:'+c.id,myc=()=>FC().my;
function V(i){if(typeof i==='string'){const c=myc().find(x=>mkey(x)===i)||{f:'',s:'',e:'',c:''};return[c.f,'','',c.s,c.e,c.c]}const e=(FC().ed||{})[i];return e||VOC[i]}
function editForm(i){if(typeof i==='string'){const c=myc().find(x=>mkey(x)===i),g=(n,l,val)=>`<label class="mut">${l}</label><input type="text" data-ef="${n}" value="${H(val)}" style="margin-bottom:8px">`;
return `<div class="card cur" id="fedit"><b>Editar cartão</b>${g(0,'Frente',c.f)}${g(3,'Resposta / estrutura',c.s)}${g(4,'Exemplo',c.e)}<label class="mut">Categoria</label><select data-ec style="margin-bottom:8px">${(CC.includes(c.c)||!c.c?CC:CC.concat([c.c])).map(x=>`<option ${x===c.c?'selected':''}>${x}</option>`).join('')}</select><div class="row"><button class="b" id="efsave">Salvar</button><button class="b g" id="efcancel">Cancelar</button><button class="b g" id="efdel">Excluir</button></div></div>`}
const v=V(i),f=(n,l)=>`<label class="mut">${l}</label><input type="text" data-ef="${n}" value="${H(v[n])}" style="margin-bottom:8px">`;
return `<div class="card cur" id="fedit"><b>Editar palavra</b>${f(0,'Palavra')}${f(3,'Estrutura')}${f(4,'Exemplo')}${f(1,'Português')}${f(2,'Significado')}<div class="row"><button class="b" id="efsave">Salvar</button><button class="b g" id="efcancel">Cancelar</button><button class="b g" id="efreset">Restaurar original</button></div></div>`}
function FC(){const f=S.fc=S.fc||{};f.pos=f.pos||0;f.days=f.days||{};f.lv=f.lv||{};f.last=f.last||{};f.my=f.my||[];return f}
function todayWords(){const f=FC();if(!f.days[today]){const n=Math.min(2,VOC.length-f.pos),a=[];for(let i=0;i<n;i++){a.push(f.pos+i);f.last[f.pos+i]=today}f.days[today]=a;f.pos+=n;save()}return f.days[today]}
function dueWords(){const f=FC(),skip=new Set(f.days[today]||[]),r=[];for(let i=0;i<0;i++){if(skip.has(i))continue;const l=f.lv[i]||0,d=iso(new Date(pd(f.last[i]||today).getTime()+INT[l]*864e5));if(d<=today)r.push([d,i])}f.my.forEach(c=>{const k=mkey(c),l=f.lv[k]||0,d=iso(new Date(pd(f.last[k]||today).getTime()+INT[l]*864e5));if(d<=today)r.push([d,k])});return r.sort((a,b)=>a[0]<b[0]?-1:1).slice(0,10).map(x=>x[1])}
function fcard(i,fl,at){const v=V(i);return `<div class="fcard ${fl?'fl':''}" ${at}="${i}"><div class="fcin"><div class="ff"><div class="fw">${H(v[0])}</div><div class="fh">toque para virar</div></div><div class="fb"><div class="fs">${H(v[3])}</div><div class="fe">${H(v[4])}</div>${typeof i==='string'&&v[5]?`<div class="fh">${H(v[5])}</div>`:""}</div></div></div>`}
function vFlash(){const f=FC();
let h=`<div class="card cur"><h2 style="margin:0">Flashcards</h2><span class="mut">${f.my.length} ${f.my.length===1?'cartão criado':'cartões criados'}</span></div>`;
if(fcRev){const R=fcRev;if(R.i>=R.q.length){h+=`<div class="card"><h3>Revisão concluída</h3><p class="mut">${R.ok} acertos de ${R.q.length}.</p><button class="b" id="rvend">Voltar</button></div>`}
else{const i=R.q[R.i];if(fcEd===i){h+=editForm(i);return h}h+=`<h3>Revisão ${R.i+1}/${R.q.length}</h3>${fcard(i,R.f,'data-rf')}<div id="rvb" class="row" style="display:${R.f?'flex':'none'};margin-top:12px"><button class="b g" id="rverr" style="flex:1">Errei</button><button class="b" id="rvok" style="flex:1">Acertei</button></div><p class="mut"><a href="#" data-fe="${i}">✎ editar esta palavra</a> · <a href="#" id="rvend">Sair da revisão</a></p>`}return h}
const due=dueWords();h+=`<div class="card" style="margin-top:14px"><h3>Revisão</h3>`+(due.length?`<p class="mut">${due.length} cartão${due.length>1?'s':''} para revisar hoje.</p><button class="b" id="rvgo">Revisar agora</button>`:'<p class="mut">Nada para revisar hoje. Os cartões voltam em 1, 2, 4, 8 e 16 dias.</p>')+'</div>';
const my=f.my.slice().reverse();
h+=`<div class="card" style="margin-top:14px"><h3>Meus cartões</h3><label class="mut">Frente (o que você quer dizer, em português ou com lacuna)</label><input type="text" id="mcf" placeholder="Ex.: Eu concordo com você" style="margin-bottom:8px">
<label class="mut">Verso: resposta / estrutura</label><input type="text" id="mcs" placeholder="Ex.: I agree with you (sem “be”)" style="margin-bottom:8px">
<label class="mut">Exemplo</label><input type="text" id="mce" placeholder="Ex.: I agree with your idea." style="margin-bottom:8px">
<label class="mut">Categoria</label><select id="mcc" style="margin-bottom:10px">${CC.map(x=>`<option>${x}</option>`).join('')}</select>
<div class="row"><button class="b" id="mcadd" style="flex:1">Criar cartão</button>${my.length?`<button class="b g" id="mytrain" style="flex:1">Treinar meus cartões</button>`:''}</div>`;
if(my.length){h+=`<details style="margin-top:12px" ${fcEd&&typeof fcEd==='string'?'open':''}><summary class="mut" style="cursor:pointer">${my.length} ${my.length>1?'cartões criados':'cartão criado'}</summary>`;
my.forEach(c=>{const k=mkey(c);if(fcEd===k){h+=editForm(k);return}h+=`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap"><div style="flex:1"><b>${H(c.f)}</b><div class="mut">${H(c.s)}${c.c?' · '+H(c.c):''}</div></div><button class="b g sm" data-fe="${k}">✎</button></div>`});h+='</details>'}
h+='</div>';
return h}
function bindFc(){const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
qa('[data-fc]').forEach(c=>c.onclick=()=>{const i=c.dataset.fc;fcFlip[i]=!fcFlip[i];c.classList.toggle('fl',fcFlip[i])});
qa('[data-fk]').forEach(c=>c.onchange=()=>{const f=FC(),i=c.dataset.fk;f.lv[i]=c.checked?4:0;f.last[i]=today;save()});
if(q('#rvgo'))q('#rvgo').onclick=()=>{fcRev={q:dueWords(),i:0,f:false,ok:0};render()};
if(q('[data-rf]'))q('[data-rf]').onclick=()=>{fcRev.f=true;q('[data-rf]').classList.add('fl');q('#rvb').style.display='flex'};

if(dow===6)h+=`<div class="card"><h3>Nível do texto no Write &amp; Improve</h3><div class="row"><select id="wll">${['A1','A2','B1','B2','C1'].map(v=>`<option>${v}</option>`).join('')}</select><input type="number" id="wlw" min="0" placeholder="palavras" style="width:110px"><button class="b" id="wl">Registrar</button></div></div>`;
if(dow===2||dow===6)h+=wrCard();
h+=`<details class="card"><summary><b>Regras do plano</b></summary><ul><li><b>Dia perdido:</b> pule e siga em frente. Nunca compense em dobro.</li><li><b>Dia ruim:</b> faça só 15 min do que for mais importante. Nunca 2 dias seguidos sem estudar.</li><li><b>Prioridade se faltar tempo:</b> Speaking, Listening e Writing, depois Grammar, depois Vocabulary, por último Reading.</li><li><b>Meta:</b> 5 de 7 dias. O B1 é possível em cerca de 6 a 7 meses.</li><li><b>Cronômetro:</b> inicie ao começar e pause em qualquer interrupção.</li></ul></details>`;
return h}
function wrCard(){const r=pr.wres;let h=`<details class="card" ${pr.wt||r||pr.busy?'open':''}><summary><b>Corrigir um texto com o Claude</b> <span class="mut">(opcional)</span></summary>`;
if(!SAMPLE)return h+`<p class="mut">Não disponível neste app. Corrija seus textos no Write &amp; Improve (o link está na tarefa de Writing).</p></details>`;
h+=`${pr.err?`<p><b>${H(pr.err)}</b></p>`:''}<select id="wtype">${['e-mail','opinion','description','story'].map(t=>`<option ${pr.wtype===t?'selected':''}>${t}</option>`).join('')}</select><textarea id="wtxt" style="margin-top:8px;min-height:130px" placeholder="Write your text here...">${H(pr.wt)}</textarea><div class="row" style="margin-top:8px"><button class="b" id="wgo" ${pr.busy?'disabled':''}>Corrigir texto</button>${pr.busy?'<span class="mut">Corrigindo (até 1 min)...</span><button class="b g sm" id="pstop">Parar</button>':''}</div>`;
if(r)h+=`<div class="unit"><div><b>Nível estimado:</b> ${H(r.level)} <span class="mut">(estimativa, não oficial)</span></div><div style="margin-top:6px"><b>Versão corrigida:</b><br>${H(r.corrected)}</div>${(r.errors||[]).length?`<ul>${r.errors.map(e=>`<li>${H(e.wrong)} → <b>${H(e.right)}</b><br><span class="mut">${H(e.why)}</span></li>`).join('')}</ul>`:''}<div><b>Pontos fortes:</b> ${H(r.strengths)}</div><div><b>Treine a seguir:</b> ${H(r.next)}</div></div>`;
return h+'</details>'}
async function askW(){const t=(pr.wt||'').trim();if(t.length<30){pr.err='Escreva um texto um pouco maior (2 ou 3 frases, pelo menos).';render();return}if(!SAMPLE||pr.busy)return;pr.busy=1;pr.err='';pr.ctl=new AbortController();render();
try{const d=await SAMPLE.json(`A Brazilian learner of English (level ${LV[phOf(monthOf(today))][1]}) wrote this ${pr.wtype}. Correct it. Text: ${JSON.stringify(t)}. Return ONLY valid JSON: {"level":"estimated CEFR level of this text (A2, B1, B2...)","corrected":"corrected version, changing as little as possible and keeping the learner's ideas","errors":[{"wrong":"...","right":"...","why":"one short sentence in Portuguese"}],"strengths":"1 or 2 short sentences in Portuguese","next":"one specific thing to practice, in Portuguese"}. List at most 6 errors, the most important ones.`,{signal:pr.ctl.signal,cache:false});
if(!d||typeof d.corrected!=='string')throw{};pr.wres=d}catch(e){pr.err=e&&e.code==='cancelled'?'':e&&e.code==='not_granted'?'Permissão negada.':e&&e.code==='rate_limited'?'Muitas solicitações. Aguarde um pouco.':'Não foi possível agora. Tente de novo.'}pr.busy=null;render()}
function vProg(){const T=totals(),w=wkOf(today),ws=[];for(let i=Math.max(1,w-7);i<=w;i++)ws.push([i,(T.wk[i]||0)/60]);const exp=Math.max(0,(dayN(today)-1)/7*8),tot=Object.values(T.by).reduce((a,b)=>a+b,0)||1,pi=phOf(monthOf(today)),p=PH[pi];
let h=`<div class="card"><div class="grid"><div class="stat"><b>${(T.min/60).toFixed(1)} h</b><span class="mut">estudadas</span></div><div class="stat"><b>${T.st}</b><span class="mut">dias seguidos (≥50% do tempo)</span></div><div class="stat"><b>${T.days}</b><span class="mut">dias estudados</span></div><div class="stat"><b>${(dayN(today)>0?T.days/dayN(today)*100:0).toFixed(0)}%</b><span class="mut">constância</span></div></div><p class="mut" style="margin:10px 0 0">Ritmo esperado hoje (5 de 7 dias): ~${exp.toFixed(0)} h. ${T.min/60>=exp-3?'Você está no ritmo.':'Você está abaixo do ritmo: volte à rotina antes de aumentar a carga.'}</p></div>`;
h+=`<div class="card"><h3>Horas por semana (últimas 8)</h3><div class="wk">${ws.map(x=>`<div style="height:${Math.min(100,x[1]/10*100)}%" title="${x[1].toFixed(1)} h"><span>S${x[0]}</span></div>`).join('')}</div><h3>Por habilidade</h3>${Object.keys(SK).map(k=>`<div class="row"><span style="width:110px">${SK[k]}</span><div class="bar" style="flex:1"><i style="width:${(T.by[k]||0)/tot*100}%"></i></div><span class="mut">${((T.by[k]||0)/60).toFixed(1)} h</span></div>`).join('')}</div>`;
h+=`<div class="card"><h3>Metas da fase: ${p.n} (${p.m})</h3>${p.goals.map((g,j)=>{const k=pi+'-'+j;return `<label class="chk"><input type="checkbox" data-g="${k}" ${S.goals[k]?'checked':''}><span>${H(g)}</span></label>`}).join('')}</div>`;
const L=S.wl.slice(-6).reverse();if(L.length)h+=`<div class="card"><h3>Nível dos textos (Write &amp; Improve)</h3><ul>${L.map(x=>`<li>${pd(x.d).toLocaleDateString('pt-BR')}: <b>${H(x.l)}</b>${x.w?`, ${H(x.w)} palavras`:''}</li>`).join('')}</ul></div>`;
h+=`<details class="card"><summary><b>Checkpoints mensais</b> <span class="mut">(meses 3, 6, 9 e 12)</span></summary><p class="mut">Notas de 1 (muito difícil) a 5 (confortável). Horas medem esforço; o progresso real está nos testes e nos textos.</p>`+CP.map(c=>{const d=S.cp[c.m]||{s:{}},due=new Date(pd(S.start));due.setDate(due.getDate()+Math.round(c.m*30.4));return `<div class="cpc" data-m="${c.m}" style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px"><b>Mês ${c.m}</b> <span class="mut">${c.t} · previsto para ${due.toLocaleDateString('pt-BR')}</span><div class="row" style="margin:8px 0">${AREAS.map(a=>`<label class="mut">${a} <select data-a="${a}">${['—',1,2,3,4,5].map(v=>`<option ${String(d.s[a]||'—')===String(v)?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div><input type="text" data-f="test" placeholder="Nota em teste (EF SET, Test-English, Cambridge)" value="${H(d.test||'')}"><textarea data-f="note" style="margin-top:6px" placeholder="Pontos fortes, fracos e o que mudar">${H(d.note||'')}</textarea></div>`}).join('')+`</details>`;
h+=`<details class="card"><summary><b>Configurações e backup</b></summary><p><label>Data de início <input type="date" id="start" value="${S.start}"></label></p><p class="mut">Seus dados ficam só neste navegador. Exporte um backup todo mês e envie na avaliação.</p><div class="row"><button class="b" id="exp">Exportar backup</button><button class="b g" id="impb">Importar backup</button><input type="file" id="imp" accept=".json" hidden></div></details>`;
return h}
function vMat(){const rows=[['Grammar','grammar-points'],['Vocabulary','vocabulary'],['Listening','listening'],['Reading','reading'],['Use of English','use-of-english'],['Writing','writing']];
return `<div class="card"><h3>Test-English por nível</h3><div style="overflow-x:auto"><table><tr><th></th>${LV.map(l=>`<th>${l[1]}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${LV.map(l=>`<td><a href="${TE(r[1],l[0])}" target="_blank" rel="noopener">abrir</a></td>`).join('')}</tr>`).join('')}</table></div><p class="mut" style="margin-bottom:0"><a href="${TC}" target="_blank" rel="noopener">Tabela de conteúdos de gramática</a>. Siga a ordem da lista do seu nível.</p></div>
<div class="card"><h3>Suas ferramentas</h3><ul><li><a href="${WI}" target="_blank" rel="noopener">Write &amp; Improve (seu workbook)</a></li><li><a href="${SH}" target="_blank" rel="noopener">Shadowing Technique</a></li><li><a href="${LE}" target="_blank" rel="noopener">Listen in English</a></li><li><a href="${CA}" target="_blank" rel="noopener">Cambridge: Activities for Learners</a></li><li><a href="${MI}" target="_blank" rel="noopener">Marine Insight: e-books e guias gratuitos</a></li><li><a href="${YT}" target="_blank" rel="noopener">YouTube</a></li></ul></div>
<div class="card"><h3>Testes e prova</h3><ul><li><a href="${LT}" target="_blank" rel="noopener">Cambridge: Test Your English</a></li><li><a href="https://www.efset.org/" target="_blank" rel="noopener">EF SET (gratuito)</a></li><li><a href="https://www.cambridgeenglish.org/br/exams-and-tests/first/exam-format/" target="_blank" rel="noopener">Formato do B2 First</a></li></ul></div>
<div class="card"><h3>Livro de vocabulário (PDF)</h3><p class="mut">250 palavras com significado, estrutura e exemplos. Opcional.</p><a class="b g" href="vocabulario.pdf" download>Baixar PDF</a></div>`}
function render(){nav();document.getElementById('main').innerHTML={hoje:vHoje,progresso:vProg,material:vMat,flash:vFlash,gram:vGram}[view]();bind();if(view==='flash')bindFc();if(view==='gram')bindGr()}
function updT(){document.querySelectorAll('.tm').forEach(e=>{const s=secs(e.dataset.k,e.dataset.i)||0;e.textContent=fmt(s);const b=e.closest('.card').querySelector('.tb');if(b)b.style.width=Math.min(100,s/60/e.dataset.p*100)+'%'});const ds=dayStat(sel),a=document.getElementById('dtot');if(a){a.textContent=Math.round(ds.min);document.getElementById('dbar').style.width=Math.min(100,ds.min/ds.plan*100)+'%'}}
setInterval(()=>{if(S.run&&view==='hoje')updT()},1000);
function bind(){const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
if(q('#dsel'))q('#dsel').onchange=e=>{if(e.target.value){sel=e.target.value;render()}};
qa('[data-start]').forEach(b=>b.onclick=()=>{stopRun();S.run={k:sel,i:b.dataset.start,t:Date.now()};save();render()});
qa('[data-pause]').forEach(b=>b.onclick=()=>{stopRun();render()});
qa('[data-zero]').forEach(b=>b.onclick=()=>{const k=sel+b.dataset.zero;if(zk===k){if(S.sec[sel])delete S.sec[sel][b.dataset.zero];save();zk=null}else{zk=k;setTimeout(()=>{if(zk===k){zk=null;if(view==='hoje')render()}},4000)}render()});
qa('[data-nt]').forEach(i=>i.oninput=()=>{S.nt[sel]=S.nt[sel]||{};S.nt[sel][i.dataset.nt]=i.value;save()});
if(q('#wnote'))q('#wnote').oninput=e=>{S.wk[wkOf(sel)]=e.target.value;save()};
if(q('#wl'))q('#wl').onclick=()=>{S.wl.push({d:sel,l:q('#wll').value,w:q('#wlw').value});save();q('#wl').textContent='Registrado';q('#wl').disabled=true};
if(q('#wtxt'))q('#wtxt').oninput=e=>{pr.wt=e.target.value};
if(q('#wtype'))q('#wtype').onchange=e=>{pr.wtype=e.target.value};
if(q('#wgo'))q('#wgo').onclick=askW;
if(q('#pstop'))q('#pstop').onclick=()=>{if(pr.ctl)pr.ctl.abort()};
qa('[data-g]').forEach(c=>c.onchange=()=>{if(c.checked)S.goals[c.dataset.g]=1;else delete S.goals[c.dataset.g];save()});
qa('.cpc').forEach(cd=>{const m=cd.dataset.m;S.cp[m]=S.cp[m]||{s:{}};cd.querySelectorAll('select').forEach(s=>s.onchange=()=>{S.cp[m].s[s.dataset.a]=s.value;save()});cd.querySelectorAll('[data-f]').forEach(f=>f.oninput=()=>{S.cp[m][f.dataset.f]=f.value;save()})});
if(q('#start'))q('#start').onchange=e=>{if(e.target.value){S.start=e.target.value;save();render()}};
if(q('#exp'))q('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='diario-ingles-'+today+'.json';a.click()};
if(q('#impb'))q('#impb').onclick=()=>q('#imp').click();
if(q('#imp'))q('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.start)throw 0;S=Object.assign({done:{},mn:{},sec:{},nt:{},wk:{},cp:{},wl:[],goals:{},run:null},o);save();render()}catch(x){alert('Arquivo inválido. Escolha um backup .json deste diário.')}};r.readAsText(f)};
}
render();
</script>
</body>
